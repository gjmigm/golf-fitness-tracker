<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Golf Workouts</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1f17;
      color: #e8f5ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin-bottom: 10px; color: #74c69d; }
    p { font-size: 15px; color: #95bba6; line-height: 1.6; max-width: 300px; }
    .hint { margin-top: 16px; font-size: 13px; color: #5c8a6e; }
    button {
      margin-top: 28px;
      padding: 14px 32px;
      background: #2d6a4f;
      color: #e8f5ee;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📵</div>
  <h1>You're offline</h1>
  <p>Your workout programs and exercise descriptions are available — but videos require an internet connection.</p>
  <p class="hint">Connect to WiFi or mobile data, then tap below.</p>
  <button onclick="window.location.href='/'">Go to Workouts</button>
</body>
</html>
